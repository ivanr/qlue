plugins {
    id 'java-library'
    id 'maven-publish'
    id 'jacoco'
}

group = 'com.webkreator'
version = '4.0.0'

compileJava {
    options.compilerArgs += ["-parameters"]
}

// The default platform charset is not UTF-8 in every environment this builds in (LANG is unset in
// containers), and the test sources carry deliberate non-ASCII in both prose and assertions.
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

repositories {
    mavenCentral()
}

dependencyLocking {
    lockAllConfigurations()
}

sourceSets {
    main {
        java.srcDirs = ["src/main/java"]
        resources.srcDirs = ["src/main/resources"]
    }

    test {
        java.srcDirs = ["src/test/java"]
        resources.srcDirs = ["src/test/resources"]
    }

    // The browser tier. Kept out of `test` so that `./gradlew test` stays hermetic: no Playwright
    // on the classpath, no driver bundle to download, no browsers to install.
    browserTest {
        java.srcDirs = ["src/browserTest/java"]
        resources.srcDirs = ["src/browserTest/resources"]
        compileClasspath += sourceSets.test.output + sourceSets.main.output
        runtimeClasspath += sourceSets.test.output + sourceSets.main.output
    }
}

configurations {
    browserTestImplementation.extendsFrom testImplementation
    browserTestRuntimeOnly.extendsFrom testRuntimeOnly
}

// The dependencies are locked; to update the locks, run: ./gradlew dependencies --write-locks
dependencies {

    // https://mvnrepository.com/artifact/org.slf4j/slf4j-api
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.0.16'

    // https://mvnrepository.com/artifact/commons-cli/commons-cli
    implementation group: 'commons-cli', name: 'commons-cli', version: '1.9.0'

    // https://mvnrepository.com/artifact/commons-codec/commons-codec
    implementation group: 'commons-codec', name: 'commons-codec', version: '1.17.2'

    // https://mvnrepository.com/artifact/org.apache.commons/commons-email
    api group: 'org.apache.commons', name: 'commons-email', version: '1.6.0'

    // https://mvnrepository.com/artifact/jakarta.mail/jakarta.mail-api
    implementation group: 'jakarta.mail', name: 'jakarta.mail-api', version: '1.6.7'

    // https://mvnrepository.com/artifact/it.sauronsoftware.cron4j/cron4j
    implementation group: 'it.sauronsoftware.cron4j', name: 'cron4j', version: '2.2.5'

    // https://mvnrepository.com/artifact/org.apache.velocity/velocity-engine-core
    implementation group: 'org.apache.velocity', name: 'velocity-engine-core', version: '2.4.1'

    // https://mvnrepository.com/artifact/com.google.code.gson/gson
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.11.0'

    // https://mvnrepository.com/artifact/org.hibernate.validator/hibernate-validator
    implementation group: 'org.hibernate.validator', name: 'hibernate-validator', version: '6.2.5.Final'

    // https://mvnrepository.com/artifact/org.glassfish/jakarta.el
    testImplementation group: 'org.glassfish', name: 'jakarta.el', version: '3.0.4'

    // https://mvnrepository.com/artifact/jakarta.servlet/jakarta.servlet-api
    compileOnly group: 'jakarta.servlet', name: 'jakarta.servlet-api', version: '4.0.4'


    // Test dependencies.

    // https://mvnrepository.com/artifact/junit/junit
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'

    // https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter', version: '6.1.2'

    // https://mvnrepository.com/artifact/org.junit.vintage/junit-vintage-engine
    // Keeps the pre-existing JUnit 4 tests (TestRouting) running on the JUnit Platform.
    testRuntimeOnly group: 'org.junit.vintage', name: 'junit-vintage-engine', version: '6.1.2'

    // https://mvnrepository.com/artifact/org.junit.platform/junit-platform-launcher
    testRuntimeOnly group: 'org.junit.platform', name: 'junit-platform-launcher', version: '6.1.2'

    // https://mvnrepository.com/artifact/org.jsoup/jsoup
    // Used by the Canoe test suite to decode attribute values the way a browser would.
    testImplementation group: 'org.jsoup', name: 'jsoup', version: '1.22.2'

    // https://mvnrepository.com/artifact/com.microsoft.playwright/playwright
    // Browser tier of the Canoe test suite. Scoped to the browserTest source set so that the
    // ~100 MB driver bundle never lands on the classpath of the hermetic `test` task.
    browserTestImplementation group: 'com.microsoft.playwright', name: 'playwright', version: '1.61.0'

    // https://mvnrepository.com/artifact/org.mockito/mockito-core
    testImplementation group: 'org.mockito', name: 'mockito-core', version: '5.11.0'

    // https://mvnrepository.com/artifact/org.slf4j/slf4j-simple
    testImplementation group: 'org.slf4j', name: 'slf4j-simple', version: '2.0.16'

    // https://mvnrepository.com/artifact/jakarta.servlet/jakarta.servlet-api
    testImplementation group: 'jakarta.servlet', name: 'jakarta.servlet-api', version: '4.0.4'
}

// `test` must stay hermetic, offline-capable and fast: no browsers, no network.
test {
    useJUnitPlatform()

    // T33's report is generated by a test, so it exists after every `test` run rather than only
    // when somebody remembers to ask for it. The path is passed in rather than hard-coded in the
    // test, because a test that writes to a relative path writes wherever the JVM happens to start.
    systemProperty 'canoe.report.dir', layout.buildDirectory.dir('reports/canoe').get().asFile.absolutePath

    // T31's fuzz seed. Fixed here so a CI failure reproduces; override on the command line to hunt:
    //   ./gradlew test --tests '*TemplateFuzzTest*' -Dcanoe.fuzz.seed=$RANDOM -Dcanoe.fuzz.iterations=200000
    systemProperty 'canoe.fuzz.seed', System.getProperty('canoe.fuzz.seed', '20260726')
    systemProperty 'canoe.fuzz.iterations', System.getProperty('canoe.fuzz.iterations', '2000')

    finalizedBy tasks.named('jacocoTestReport')
}

// ---------------------------------------------------------------------------
// T30 - the coverage gate
// ---------------------------------------------------------------------------

jacoco {
    // Latest on Maven Central as of 2026-07-26; earlier lines do not instrument JDK 25 class files.
    toolVersion = '0.8.15'
}

jacocoTestReport {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

/**
 * Branch-coverage floors for the code the Canoe security review is about.
 *
 * WHY BRANCHES, AND WHY A FLOOR AT ALL. An unreached branch in Canoe's tokenizer is, by definition,
 * a security decision nobody tested: every one of them classifies an attribute name, an attribute
 * value prefix or a parser state. F1, F7 and F19 were each "a branch that is never taken", and F21
 * was its sibling (a dead switch arm, reachable only by a direct encode() call, closed by deletion
 * in R14). So the gate is on *branch* coverage and not on lines, and it measures the two encoding
 * classes plus the three places outside them where a value's encoding is decided.
 *
 * THE THREE RULES THIS COMMENT EXISTS TO ENFORCE.
 *
 *   1. Every floor sits ONE OUTCOME below its measurement. Losing a single branch outcome in a
 *      gated target must fail the build; a floor with slack in it is a gate that has stopped
 *      measuring. The arithmetic for each is written out below, so the next person can check it
 *      rather than trust it.
 *   2. A floor may be LOWERED only together with an entry in the inventory below that proves the
 *      branch dead and names the test that proves it. "The gate went red, so I lowered the number"
 *      is the exact failure this gate was built against.
 *   3. A floor may also MOVE because the DENOMINATOR changed with nothing becoming unreached - R3
 *      retired 72 live branches and R8 another 13, and retiring covered branches lowers a sub-100%
 *      ratio without losing anything. That is legitimate and it is not rule 2: the inventory must
 *      come out unchanged, and the new floor must again sit one outcome below the new measurement.
 *
 * HOW TO RE-MEASURE, because this comment used to be re-derived from its own arithmetic and
 * drifted. Read build/reports/jacoco/test/jacocoTestReport.xml - `./gradlew test` regenerates it -
 * method by method, and take the dead outcomes from the per-line `mb`/`cb` attributes rather than
 * from the totals. Two traps:
 *
 *   - JaCoCo counts a switch's distinct JUMP TARGETS, not its case labels. Two labels sharing a
 *     body are ONE outcome: R19 added `case TAG_ATTR_VALUE_BEFORE:` immediately above `case
 *     TAG_ATTR_VALUE:` and moved no number at all, and currentContext()'s inner switch has eight
 *     ATTR_* labels but seven targets, because ATTR_CSS/ATTR_DATA/ATTR_ACTIONSCRIPT share one
 *     `return CTX_SUPPRESS`. A `default:` whose body is identical to another arm's is still its own
 *     target. Never infer a branch count from the shape of the source.
 *   - a TRAILING `else` whose whole body is a call to raiseError() is reported MISSED however hard
 *     the suite drives it. JaCoCo does not probe the edge; it probes the end of the block, and
 *     records the block only if the block COMPLETES. raiseError() always throws, so the else-block
 *     never reaches its probe and the outcome reads unreached even though a test drove it, asserted
 *     the message and asserted the position. Those are inventoried below as UNMEASURABLE rather than
 *     as unreached, each with the test that does drive it.
 *
 *     THE DISTINCTION IS NARROW, and the pair that fixes its boundary is in this file's own
 *     measurement rather than in an argument. Canoe.java:1290, DOCTYPE_TEST, is
 *     `if (mismatch) { raiseError(...); } else { ... }` and reads 2/2 COVERED; Canoe.java:1302,
 *     COMMENT_OPEN_2, is `if (c == '-') { ... } else { raiseError(...); }` and reads 1/2. Same
 *     method, same throwing call, opposite results - because the arm that throws in the first case
 *     is followed by a jump into a block the other arm also reaches, and coverage propagates back
 *     along it. So the rule is about WHICH ARM throws and not about throwing at all, it cannot be
 *     inferred from reading the source, and it is not a category anybody may widen to taste: an arm
 *     goes on the UNMEASURABLE list only with a test that drives it and asserts what it produced.
 *     (R18's two DOCTYPE rejections are the first shape and are measured covered.)
 *
 * MEASURED 2026-07-27, after R31, from the XML. Every figure here was read today; none is carried
 * forward from a task note. The per-task narrative this comment used to accumulate is kept with the
 * remediation record rather than here, which is where a history belongs.
 *
 * R29/R30/R31 - the fixes for the second review's F25-F28 - moved the two class denominators and
 * nothing else. This is RULE 3 and not rule 2: 76 branch outcomes were ADDED to Canoe (the URL
 * position machine and its two scheme predicates, the value-strip predicate, the resource-sink set
 * test and the positional encoder), every one of them is reached, and THE DEAD-BRANCH INVENTORY
 * BELOW COMES OUT UNCHANGED - 11 outcomes in Canoe and 5 in HtmlEncoder, the same 16, in the same
 * methods, for the same reasons. Only two floors move, and both move UP.
 *
 *   Canoe                                        368 / 379   97.10%
 *     Canoe(Writer, Set, Collection)               2 /   2  100.00%
 *     normalisePlainTextAttributeNames()          20 /  20  100.00%   gated
 *     isNameChar()                                14 /  14  100.00%
 *     isEndTagNameDelimiter()                     14 /  14  100.00%
 *     isInitialModeWhitespace()                    8 /   8  100.00%
 *     asciiToLowerCase()                           4 /   4  100.00%
 *     isUrlStripped()                             10 /  10  100.00%   new in R30/R31
 *     isSchemeStart()                              8 /   8  100.00%   new in R30
 *     isSchemeChar()                              12 /  12  100.00%   new in R30
 *     advanceUrlValueState()                      28 /  28  100.00%   gated (new in R30)
 *     write(char[], int, int)                      2 /   2  100.00%
 *     detectAttributePrefix()                     10 /  10  100.00%
 *     bufferedValueIs()                            6 /   6  100.00%
 *     setTagAttributeContext()                    10 /  10  100.00%   gated
 *     isResourceLoadingSink()                      4 /   4  100.00%   gated (new floor in R29)
 *     isPlainTextAttributeName()                   6 /   6  100.00%
 *     bufferedNameStartsWith()                     6 /   6  100.00%
 *     processChar()                                2 /   2  100.00%
 *     reallyProcessChar()                        173 / 178   97.19%   gated
 *     inBuf()                                      0 /   4    0.00%
 *     currentContext()                            11 /  13   84.62%
 *     encode(String, int)                          6 /   6  100.00%
 *     encode(String)                               2 /   2  100.00%
 *     encodeResourceUrl()                         10 /  10  100.00%   gated (new in R30)
 *   HtmlEncoder                                  315 / 320   98.44%
 *     appendHierPart()                            27 /  28   96.43%
 *     percentDecode()                              7 /  10   70.00%
 *     css(String, StringBuilder)                  15 /  16   93.75%
 *     every other method                         266 / 266  100.00%
 *   CanoeReferenceInsertionHandler                18 /  18  100.00%   gated (new in R27)
 *     referenceInsert()                            8 /   8  100.00%   gated
 *     encodingMustBeDeferred(Stream)               8 /   8  100.00%   gated
 *     lambda$encodingMustBeDeferred$1              2 /   2  100.00%
 *   CanoeEncodingException                         6 /   6  100.00%
 *     findIn(Throwable)                            6 /   6  100.00%   gated (new in R27)
 *   VelocityViewFactory                           46 /  54   85.19%   NOT gated as a class
 *     discardPartialResponse()                     4 /   4  100.00%   gated (new in R27)
 *     addPlainTextAttributesFromProperty()         6 /   6  100.00%   gated (new in R27)
 *     addTrustedResourceOrigins(Collection)        6 /   6  100.00%   gated (new in R27)
 *     addTrustedResourceOriginsFromProperty()      6 /   6  100.00%   gated (new in R27)
 *     buildDefaultVelocityProperties()             7 /  12   58.33%   live, untested - see below
 *     render(Page, VelocityView, Writer)          13 /  14   92.86%   live, untested - see below
 *     processPageFields()                          4 /   6   66.67%   live, untested - see below
 *
 * THREE THINGS THE OLD COMMENT CARRIED ARE WRONG, and they are corrected here rather than left
 * standing. (a) currentContext() read 10/12 in the per-method table; it is 11/13, and has been
 * since R17 added the SCRIPT_END_NAME and CSS_END_NAME arms - R17's note said so in prose and never
 * updated the table. (b) the inventory's "all seven ATTR_* constants have a case above it" is off
 * by one: there are EIGHT ATTR_* constants, and it is the shared CTX_SUPPRESS body that makes them
 * seven jump targets. (c) worse than either, because it is not arithmetic: the test cited as proof
 * that the URL state is dead - AttributeNameMatrixTest.thereIsNoCtxCssAndStyleStillSuppresses - is
 * about the CTX_CSS constant and says nothing whatever about the URL state, so two inventory
 * entries stood on a citation that did not support them. R27 adds the test that does. R20 had
 * already caught a fourth of the same kind (setTagAttributeContext() reads 10/10, not the 8/8
 * recorded under R5; R9's isResourceLoadingSink() ternary was never counted). Carrying a figure or
 * a citation forward instead of re-reading it is the rot this reconciliation exists to end.
 *
 * THE FLOORS, AND THE ARITHMETIC THAT SETS EACH ONE. `measured` is today's ratio, `one lost` is
 * what the same target would read with one further outcome unreached, and the floor is between
 * them.
 *
 *   Canoe                                 368/379 = 97.0976%   one lost 367/379 = 96.8338%   0.970
 *   HtmlEncoder                           315/320 = 98.4375%   one lost 314/320 = 98.1250%   0.982
 *   CanoeReferenceInsertionHandler          18/18 = 100%       one lost   17/18 = 94.4444%   0.99
 *   Canoe#setTagAttributeContext            10/10 = 100%       one lost   9/10  = 90.0000%   0.99
 *   Canoe#reallyProcessChar               173/178 = 97.1910%   one lost 172/178 = 96.6292%   0.970
 *   Canoe#normalisePlainTextAttributeNames   20/20 = 100%      one lost  19/20  = 95.0000%   0.99
 *   Canoe#advanceUrlValueState              28/28 = 100%       one lost  27/28  = 96.4286%   0.99
 *   Canoe#encodeResourceUrl                 10/10 = 100%       one lost   9/10  = 90.0000%   0.99
 *   Canoe#isResourceLoadingSink               4/4 = 100%       one lost    3/4  = 75.0000%   0.99
 *   CanoeReferenceInsertionHandler#referenceInsert
 *                                             8/8 = 100%       one lost    7/8  = 87.5000%   0.99
 *   CanoeReferenceInsertionHandler#encodingMustBeDeferred
 *                                             8/8 = 100%       one lost    7/8  = 87.5000%   0.99
 *   CanoeEncodingException#findIn             6/6 = 100%       one lost    5/6  = 83.3333%   0.99
 *   VelocityViewFactory#discardPartialResponse
 *                                             4/4 = 100%       one lost    3/4  = 75.0000%   0.99
 *   VelocityViewFactory#addPlainTextAttributesFromProperty
 *                                             6/6 = 100%       one lost    5/6  = 83.3333%   0.99
 *   VelocityViewFactory#addTrustedResourceOrigins
 *                                             6/6 = 100%       one lost    5/6  = 83.3333%   0.99
 *   VelocityViewFactory#addTrustedResourceOriginsFromProperty
 *                                             6/6 = 100%       one lost    5/6  = 83.3333%   0.99
 *
 * The two class floors are the tight ones (0.970 and 0.982 against 0.9683 and 0.9813), and that is
 * deliberate: they are the only figures that catch a dead branch in a method nobody thought to
 * gate. The task's gate output prints the floor to two decimals for the same reason - a floor of
 * 0.962 displayed as "96%" is a floor nobody can check.
 *
 * WHY THESE TARGETS AND NOT OTHERS.
 *
 *   normalisePlainTextAttributeNames() is gated individually, and it is the one entry in this list
 *   that is a security decision rather than a measurement: it is the guard that stops an
 *   application putting `sandbox`, `nonce` or `srcdoc` back on the plain-text allowlist through
 *   configuration. An unreached branch in it is a refusal nobody tested.
 *
 *   setTagAttributeContext() and reallyProcessChar() are the classifier and the state machine - the
 *   two methods T30 named, and the two the review's findings were mostly in.
 *
 *   THREE MORE Canoe METHODS JOIN THE GATE in R29/R30, by the sentence at the top of this comment
 *   with "attribute name" replaced by "origin". The second review's F25, F26 and F27 were all cases
 *   where the ENCODER was right and the routing was not, and these three are the whole of that
 *   routing:
 *     - isResourceLoadingSink() decides whether a URL value is judged against an origin at all. It
 *       was a string equality on one attribute per element, and SVG's <script> has three, so
 *       <script href> and <script xlink:href> ran an attacker's script in all three engines while
 *       <script src> on the same element was suppressed (F25). Four outcomes, all reached.
 *     - advanceUrlValueState() decides WHERE in a URL a reference sits, which is the half of the
 *       origin question that is not in the reference. An unreached transition here is a position
 *       nobody tested, and a wrong position is the difference between suppressing a value and
 *       letting it complete an authority (F26). Twenty-eight outcomes.
 *     - encodeResourceUrl() is the decision itself: it reads that position and either suppresses or
 *       hands the value to urlResource(). Ten outcomes.
 *   isUrlStripped(), isSchemeStart() and isSchemeChar() are pure predicates behind them and are
 *   covered by the class figure, as isNameChar() is.
 *
 *   CanoeReferenceInsertionHandler JOINS THE GATE in R27, by exactly the argument above. R24 put
 *   the nested-render detector here, so this class is now where it is decided whether a value is
 *   written UNENCODED: referenceInsert() returns the value untouched on two paths - a reference
 *   whose source text starts with one of the four `_x` spellings (R23, the deliberate bypass) and a
 *   reference inside an interpolated string literal (R24, F12, deferred to the position it is
 *   really printed), and encodingMustBeDeferred() is the whole of the second decision. An unreached
 *   outcome in either is a bypass nobody tested, which is the same sentence as the one at the top
 *   of this comment with "tokenizer" replaced. The class floor catches the lambda too; the two
 *   method floors keep rule 1 true if the class grows, since a class-level 0.99 stops biting once
 *   the denominator is large. Both are 8/8 and the class is 18/18, so there is nothing to
 *   inventory.
 *
 *   CanoeEncodingException#findIn() JOINS THE GATE. R21 made a Canoe rejection a typed exception
 *   precisely so the fail-closed path could recognise it through Velocity's wrapping, and findIn()
 *   is that recognition: if it stops answering, the partial response is not discarded and the
 *   request does not fail. Its six outcomes are the type match, the null terminator and the 32-link
 *   depth bound, from both sides. Gated as a method rather than as a class, because the class
 *   figure is the method figure only until somebody adds a second branch-bearing method to it.
 *
 *   VelocityViewFactory JOINS THE GATE as FOUR METHODS AND NOT AS A CLASS, and the shape of that
 *   answer is the point. R27 first measured the class at 42/54 = 77.78% and found that FOUR of the
 *   twelve missed outcomes sat on the allowlist configuration entry points -
 *   addPlainTextAttributesFromProperty()'s `!name.isEmpty()` (then 5/6),
 *   addTrustedResourceOrigins(Collection)'s `origin != null && !origin.trim().isEmpty()` (then 4/6,
 *   which is TWO outcomes and not one) and addTrustedResourceOriginsFromProperty()'s
 *   `!origin.isEmpty()` (then 5/6). Those are live branches, reachable from ordinary
 *   configuration - `split("[,\\s]+")` yields an empty first element for any value that opens with a
 *   separator, and HtmlEncoder.parseTrustedOrigins() SKIPS a null or blank entry rather than
 *   refusing it, so the collection form's guard is reachable too - and they are the entry points to
 *   two security allowlists that R25 documents as the supported escape hatches. By this comment's
 *   own rule they were untested security decisions, and the answer to an untested branch is a test
 *   and not a floor. R27 wrote the tests rather than recording them as follow-up:
 *   ViewFactoryRenderTest.aLeadingSeparatorInAnAllowlistPropertyIsDroppedRatherThanConfigured and
 *   .aNullOrBlankTrustedOriginIsDroppedRatherThanAllowlisted. All three methods are now 6/6 and all
 *   three are gated, along with discardPartialResponse(), which is 4/4 (null response, committed,
 *   uncommitted) and is the far end of the same fail-closed path findIn() begins: findIn() decides
 *   that this was an encoding error, discardPartialResponse() is what stops the half-encoded page
 *   reaching the client.
 *
 *   The CLASS is deliberately NOT gated, at 46/54 = 85.19%. The remaining eight missed outcomes are
 *   also live and also untested - buildDefaultVelocityProperties()'s five property-presence checks
 *   (7/12), render()'s `qlueSession != null` (13/14), and processPageFields()'s `STATE_` prefix skip
 *   plus a `fields == null` guard that Class.getFields() cannot actually satisfy (4/6) - but none of
 *   them decides how a value is encoded, so they are ordinary test debt rather than this gate's
 *   subject. A class floor here would freeze that debt behind a number and advertise a coverage the
 *   class does not have; four method floors say exactly what is measured. Recorded with the
 *   remediation record as follow-up work, and the class floor goes in if those tests do.
 *
 *   Note for whoever adds a fifth floor here: addTrustedResourceOrigins is OVERLOADED, and the
 *   gate sums every method of that name (see the comment in the task body). The varargs form
 *   carries no branch counter, so the sum is the Collection form's 6/6 - the same arrangement
 *   encodingMustBeDeferred() already relies on.
 *
 *   Everything else in Canoe and HtmlEncoder is a pure predicate with no configuration behind it -
 *   isNameChar(), isPlainTextAttributeName(), isEndTagNameDelimiter(), isInitialModeWhitespace(),
 *   asciiToLowerCase(), isUnreserved(), isHex(), allDigits() - and is covered by the class figure.
 *
 * THE DEAD-BRANCH INVENTORY: 16 outcomes, 11 in Canoe and 5 in HtmlEncoder, and NOT ONE OF THEM IS
 * A FINDING. That claim is the point of the list. Every unreached branch in these classes is either
 * something an input cannot produce, something JaCoCo cannot observe, or code with no live caller;
 * anything else belongs in the review, not here. Line numbers are as measured on 2026-07-27.
 *
 *   Canoe.reallyProcessChar(), 5 outcomes
 *
 *      1  the default arm of switch(state) (Canoe.java:1205, 1 of 22 targets). TWENTY-THREE state
 *         constants are declared (HTML=0 through CSS_END_NAME=21, plus INVALID=666); twenty-one have
 *         a case label, and twenty-one labels plus the implicit default is the 22 JaCoCo counts. The
 *         two constants that have no label are URL, which nothing ever assigns, and INVALID, which
 *         is only ever assigned inside raiseError() immediately before it throws. NOT A FINDING -
 *         it is a default arm no state can reach, and reaching it
 *         would mean the state field held a value the class never writes.
 *         -> CanoeStateMachineTest.theInventoriedDeadBranchesHaveNoWriterAndNoCaller asserts
 *            against the source that nothing assigns URL (R27 added it; the citation this entry
 *            used to carry, AttributeNameMatrixTest.thereIsNoCtxCssAndStyleStillSuppresses, is
 *            about CTX_CSS and proves nothing about the URL state), and
 *            CanoeRobustnessTest.everyRaiseErrorMessageIsReached covers INVALID: it is assigned
 *            inside raiseError() on the line before the throw.
 *
 *      1  UNMEASURABLE. COMMENT_OPEN_OR_DOCTYPE's `else if ((c == 'D') || (c == 'd'))`
 *         (Canoe.java:1241, 1 of 4): the `c == 'd'` false outcome, whose else calls
 *         raiseError("Invalid tag") and falls through to `break`. Driven, not unreached.
 *         -> CanoeRobustnessTest.rejections() row "bang that is neither comment nor doctype"
 *            (<!x>), which asserts the message and the position.
 *
 *      1  UNMEASURABLE. COMMENT_OPEN_2's `if (c == '-')` (Canoe.java:1302, 1 of 2): the false
 *         outcome, same shape and same reason.
 *         -> CanoeRobustnessTest.rejections() row "single dash after a bang" (<!-x-->).
 *
 *      1  the default arm of switch(attrQuotes) (Canoe.java:1586, 1 of 4). attrQuotes is assigned
 *         exactly one of QUOTE_NONE/QUOTE_SINGLE/QUOTE_DOUBLE and nowhere else. NOT A FINDING.
 *         -> NearMissNameSweepTest's class javadoc records it as one of the two arms with no
 *            reachable input.
 *
 *      1  "Internal error #1001" - the `bufLen == buf.length` true outcome (Canoe.java:1626, 1 of
 *         2). Value scanning gives up at bufLen == 10 and buf is MAX_TAGNAME_LEN long, so bufLen
 *         cannot equal buf.length here. NOT A FINDING; it is a defensive check on an invariant the
 *         code above it maintains.
 *         -> CanoeRobustnessTest.everyRaiseErrorMessageIsReached asserts that this is the ONLY
 *            unreached message of the thirteen distinct ones (15 call sites), so a new unreachable
 *            rejection fails that test rather than quietly joining this list, and
 *            .theInternalErrorBranchIsDeadCode feeds 200 value characters one at a time and asserts
 *            bufLen stays in -1..10.
 *
 *   Canoe.currentContext(), 2 outcomes  (not gated individually; part of the class figure)
 *
 *      1  `case URL` (Canoe.java:1805, 1 of 6 targets) - the URL state is declared and never
 *         assigned, the same dead constant as the switch(state) default above. NOT A FINDING, but
 *         see the note under "OBSERVED" below: the constant itself is deletable.
 *         -> CanoeStateMachineTest.theInventoriedDeadBranchesHaveNoWriterAndNoCaller.
 *
 *      1  the inner switch(attributeContext) default (Canoe.java:1890, 1 of 7 targets). All EIGHT
 *         ATTR_* constants have a case label above it - ATTR_UNKNOWN included since R5, which is
 *         what makes the unknown-name path a diagnostic rather than a fall-through - so nothing
 *         setTagAttributeContext() can produce reaches it. NOT A FINDING, and it fails closed
 *         anyway: the arm returns CTX_SUPPRESS. (This was tagged F21; R14 closed F21 by deleting
 *         CTX_CSS, and the inner default stays dead for the unrelated reason that every ATTR_* is
 *         matched.)
 *
 *   Canoe.inBuf(), 4 outcomes  (not gated individually; part of the class figure)
 *
 *      4  the method has no live caller: the only two references to it in the file are
 *         commented-out debug statements (Canoe.java:1387, 1509), and nothing in src/test calls it
 *         either, though it is `protected` and a subclass could. NOT A FINDING - it reads the
 *         buffer and returns a string, it decides nothing - but it is dead code; see "OBSERVED"
 *         below.
 *         -> CanoeStateMachineTest.theInventoriedDeadBranchesHaveNoWriterAndNoCaller, which fails
 *            if any mention of inBuf() outside its own declaration stops being a comment.
 *
 *   HtmlEncoder, 5 outcomes
 *
 *      1  the null guard of the private css(String, StringBuilder) (HtmlEncoder.java:808, 1 of 2).
 *         The public css(String) returns null before calling it and nothing else calls it. NOT A
 *         FINDING.
 *         -> HtmlEncoderTest.theAppendingOverloadsAppendNothingForNull says so in its javadoc.
 *
 *      1  the second half of appendHierPart()'s fragment guard, `i < s.length() && s.charAt(i) ==
 *         '#'` (HtmlEncoder.java:352, 1 of 4): the '#' comparison's false outcome. The query block
 *         above sets `i` to either the '#' that begins the fragment or the end of the string, so
 *         whenever `i < s.length()` holds, the character there is '#'. NOT A FINDING - control
 *         flow, not input, decides it.
 *         -> HtmlEncoderUrlTest.aFullHierarchyIsSplitIntoItsComponents and
 *            .theAuthorityStopsAtTheFirstQueryOrFragment reach every fragment/no-fragment path.
 *
 *      3  percentDecode()'s incomplete-escape guards: `i + 2 < input.length()` false
 *         (HtmlEncoder.java:613, 1 of 4) and both isHex() false outcomes (HtmlEncoder.java:614, 2
 *         of 4). percentDecode() runs on exactly one input - the host that authorityOf() carved out
 *         of url()'s own output - and url() never emits a bare or truncated '%': every '%' it
 *         writes begins a complete '%XX' from a hex pair, and a '%' that did not was itself escaped
 *         to '%25'. So "not a %" and "a complete %XX" are both reached and "a % with fewer than two
 *         hex digits after it" cannot be. NOT A FINDING, and it fails safe twice over if it ever
 *         were: a residual literal '%' survives into `decoded`, hasForbiddenHostChar() lists '%' as
 *         forbidden, the host fails to parse and authorityOf() answers "no live authority" - which
 *         is the right answer for a value url() already neutralised.
 *         -> HtmlEncoderResourceUrlTest.valuesUrlAlreadyNeutralisedAreNotSuppressedAgain and
 *            .aHostThatFailsToParseIsNotAnOffOriginAuthority reach the live percent-decode paths
 *            (%40, %5C, %01, %7F) through url()-encoded input, which is the only way in.
 *
 * OBSERVED WHILE RECONCILING, and recorded rather than acted on because R27 is build hygiene and
 * changes nothing under src/main:
 *
 *   - the URL state constant (Canoe.java:132) is written by nothing and read by two dead branches
 *     (switch(state)'s default and currentContext()'s `case URL`). Deleting it, and the `case URL`
 *     arm with it, would remove two of the eleven Canoe entries above and cost nothing; CTX_URI is
 *     a separate constant and stays. Worth a follow-up, with
 *     CanoeStateMachineTest.theInventoriedDeadBranchesHaveNoWriterAndNoCaller rewritten from
 *     "nothing assigns URL" to "URL does not exist".
 *   - inBuf() (Canoe.java:1771) has no caller at all. Deleting it removes four more, and the same
 *     test carries the assertion that would have to change.
 *   Both are deletions of dead code, not of a security decision, and neither is urgent. R27 does
 *   not make them because it changes nothing under src/main.
 */
ext.canoeCoverageFloors = [
        // Class figures. These are the tight ones: they are what catches a dead branch in a method
        // nobody thought to gate. See the arithmetic in the comment above before touching either.
        [kind: 'class',  target: 'com/webkreator/qlue/view/Canoe',       floor: 0.970],
        [kind: 'class',  target: 'com/webkreator/qlue/util/HtmlEncoder', floor: 0.982],
        [kind: 'class',  target: 'com/webkreator/qlue/view/velocity/CanoeReferenceInsertionHandler',
         floor: 0.99],

        // The methods that decide, individually, so that the class floors staying loose as their
        // denominators grow cannot quietly stop protecting them.
        [kind: 'method', target: 'com/webkreator/qlue/view/Canoe#setTagAttributeContext',
         floor: 0.99],
        [kind: 'method', target: 'com/webkreator/qlue/view/Canoe#reallyProcessChar',
         floor: 0.970],
        [kind: 'method', target: 'com/webkreator/qlue/view/Canoe#normalisePlainTextAttributeNames',
         floor: 0.99],

        // R29/R30: the three methods that decide whether a URL value is judged against an origin,
        // where in the URL it sits, and what that position permits. F25, F26 and F27 were all
        // routing defects behind a correct encoder, and this is the routing.
        [kind: 'method', target: 'com/webkreator/qlue/view/Canoe#isResourceLoadingSink',
         floor: 0.99],
        [kind: 'method', target: 'com/webkreator/qlue/view/Canoe#advanceUrlValueState',
         floor: 0.99],
        [kind: 'method', target: 'com/webkreator/qlue/view/Canoe#encodeResourceUrl',
         floor: 0.99],
        [kind: 'method', target: 'com/webkreator/qlue/view/velocity/CanoeReferenceInsertionHandler'
                + '#referenceInsert', floor: 0.99],
        [kind: 'method', target: 'com/webkreator/qlue/view/velocity/CanoeReferenceInsertionHandler'
                + '#encodingMustBeDeferred', floor: 0.99],
        [kind: 'method', target: 'com/webkreator/qlue/view/CanoeEncodingException#findIn',
         floor: 0.99],

        // VelocityViewFactory is gated method by method and not as a class: these four decide
        // whether a half-encoded page reaches the client and what goes on the two security
        // allowlists, and the other eight missed outcomes in the class decide nothing about
        // encoding. See the paragraph above before adding a class floor here.
        [kind: 'method', target: 'com/webkreator/qlue/view/velocity/VelocityViewFactory'
                + '#discardPartialResponse', floor: 0.99],
        [kind: 'method', target: 'com/webkreator/qlue/view/velocity/VelocityViewFactory'
                + '#addPlainTextAttributesFromProperty', floor: 0.99],
        [kind: 'method', target: 'com/webkreator/qlue/view/velocity/VelocityViewFactory'
                + '#addTrustedResourceOrigins', floor: 0.99],
        [kind: 'method', target: 'com/webkreator/qlue/view/velocity/VelocityViewFactory'
                + '#addTrustedResourceOriginsFromProperty', floor: 0.99],
]

tasks.register('canoeCoverageGate') {
    group = 'verification'
    description = 'Fails if branch coverage of the Canoe encoding path drops below the T30 floors.'

    dependsOn tasks.named('jacocoTestReport')

    def reportFile = layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml')
    def floors = canoeCoverageFloors
    inputs.file(reportFile)
    outputs.upToDateWhen { false }

    doLast {
        def file = reportFile.get().asFile
        if (!file.exists()) {
            throw new GradleException("No JaCoCo XML report at ${file}. Run ./gradlew test first.")
        }

        // The report carries a DOCTYPE pointing at a report.dtd that is not on disk.
        def parser = new groovy.xml.XmlParser(false, false)
        parser.setFeature('http://apache.org/xml/features/nonvalidating/load-external-dtd', false)
        parser.setFeature('http://apache.org/xml/features/disallow-doctype-decl', false)
        def report = parser.parse(file)

        def branchRatioOf = { node ->
            def counter = node.counter.find { it.@type == 'BRANCH' }
            if (counter == null) {
                return null
            }
            int missed = counter.@missed as int
            int covered = counter.@covered as int
            [covered: covered, total: missed + covered,
             ratio  : (missed + covered) == 0 ? 1.0d : covered / (double) (missed + covered)]
        }

        def failures = []
        def measurements = []

        floors.each { floor ->
            def name = floor.target
            def measured = null

            if (floor.kind == 'class') {
                def cls = report.'**'.class.find { it.@name == name }
                if (cls != null) {
                    measured = branchRatioOf(cls)
                }
            } else {
                def (className, methodName) = name.split('#')
                def cls = report.'**'.class.find { it.@name == className }
                if (cls != null) {
                    // A method name is not unique - HtmlEncoder has five overloads called html -
                    // so every match is summed, which is what "coverage of this method" means when
                    // the method is overloaded. One gated method is: encodingMustBeDeferred() has a
                    // no-argument form that walks the real stack and a Stream form that decides, and
                    // only the second carries a branch counter, so the sum is the second's 8/8. A
                    // lambda is NOT summed in - javac names it lambda$encodingMustBeDeferred$1 - and
                    // that is why CanoeReferenceInsertionHandler carries a class floor as well.
                    def methods = cls.method.findAll { it.@name == methodName }
                    if (!methods.isEmpty()) {
                        int covered = 0
                        int total = 0
                        methods.each {
                            def r = branchRatioOf(it)
                            if (r != null) {
                                covered += r.covered
                                total += r.total
                            }
                        }
                        measured = [covered: covered, total: total,
                                    ratio  : total == 0 ? 1.0d : covered / (double) total]
                    }
                }
            }

            // A gate that silently matches nothing is a gate that measures nothing, so an absent
            // target is a failure rather than a pass.
            if (measured == null) {
                failures << "${name}: not present in the JaCoCo report. Renamed, or no longer" +
                        " instrumented - either way this gate was about to pass without measuring" +
                        " anything."
                return
            }

            // Two decimals on the floor as well as on the measurement: the floors sit one branch
            // outcome below what they gate, so several are 96.20% or 98.20% and a whole-percent
            // rendering of them is a number nobody can check against the arithmetic in the comment.
            measurements << String.format('  %-92s %4d/%-4d = %7.3f%%  (floor %6.2f%%)',
                    name, measured.covered, measured.total, measured.ratio * 100, floor.floor * 100)

            if (measured.ratio < floor.floor) {
                failures << String.format(
                        '%s: branch coverage %.2f%% (%d/%d) is below the floor of %.2f%%.',
                        name, measured.ratio * 100, measured.covered, measured.total,
                        floor.floor * 100)
            }
        }

        logger.lifecycle('Canoe branch-coverage gate (T30):')
        measurements.each { logger.lifecycle(it) }

        if (!failures.isEmpty()) {
            throw new GradleException('Canoe coverage gate failed:\n  ' + failures.join('\n  ')
                    + '\n\nAn unreached branch on the Canoe encoding path is an untested security'
                    + ' decision: every one of them classifies an attribute name, an attribute value'
                    + ' prefix, a parser state, or whether a value is written unencoded. Each floor'
                    + ' here sits ONE branch outcome below its measurement, so this failure means'
                    + ' exactly one of three things.\n'
                    + '\n  1. A test was deleted or disabled and a branch is no longer reached.'
                    + ' Restore the coverage. This is the usual cause and the one the gate is for.'
                    + '\n  2. A branch became genuinely unreachable - typically because a finding was'
                    + ' fixed. Lower the floor AND add the branch to the dead-branch inventory in the'
                    + " comment above 'ext.canoeCoverageFloors' in build.gradle, naming the method,"
                    + ' the branch, why no input can reach it, whether it is a finding, and the test'
                    + ' that proves it dead. Never lower a floor without that entry.'
                    + '\n  3. Live branches were retired, so a sub-100% ratio fell with nothing'
                    + ' becoming unreached. Re-measure from'
                    + ' build/reports/jacoco/test/jacocoTestReport.xml, confirm the inventory comes'
                    + ' out unchanged, and set the new floor one outcome below the new measurement.'
                    + '\n\nRe-measure from the XML report, method by method - never from this'
                    + " comment's arithmetic, and never from the shape of the source: JaCoCo counts a"
                    + " switch's distinct jump targets and not its case labels.")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('canoeCoverageGate')
}

// The browser tier of the Canoe suite. Not wired into `check`, so `./gradlew build`
// never needs a browser install. Run explicitly: ./gradlew browserTest
tasks.register('browserTest', Test) {
    group = 'verification'
    description = 'Runs the Playwright-driven Canoe browser tests.'

    testClassesDirs = sourceSets.browserTest.output.classesDirs
    classpath = sourceSets.browserTest.runtimeClasspath

    useJUnitPlatform()

    // Honour a shared browser cache if the environment provides one.
    if (System.getenv('PLAYWRIGHT_BROWSERS_PATH') != null) {
        environment 'PLAYWRIGHT_BROWSERS_PATH', System.getenv('PLAYWRIGHT_BROWSERS_PATH')
    }

    // Running tests must never trigger a browser download: that is playwrightInstall's job, and a
    // silent 8-minute download inside a test run is indistinguishable from a hang. Without this,
    // a read-only shared browser cache turns every run into a failed download attempt.
    environment 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', '1'

    shouldRunAfter tasks.named('test')

    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
}

// Downloads the browser binaries Playwright needs. Run once before `browserTest`.
tasks.register('playwrightInstall', JavaExec) {
    group = 'verification'
    description = 'Downloads the Playwright browser binaries (chromium, firefox, webkit).'

    classpath = sourceSets.browserTest.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', 'chromium', 'firefox', 'webkit'

    if (System.getenv('PLAYWRIGHT_BROWSERS_PATH') != null) {
        environment 'PLAYWRIGHT_BROWSERS_PATH', System.getenv('PLAYWRIGHT_BROWSERS_PATH')
    }
}

task sourcesJar(type: Jar, dependsOn: classes) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

artifacts {
    archives sourcesJar
    //archives javadocJar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/ivanr/qlue"
            credentials {
                // Working with the Gradle registry
                // https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-gradle-registry
                username = System.getenv("GITHUB_PACKAGES_USERNAME")
                password = System.getenv("GITHUB_PACKAGES_PASSWORD")
            }
        }
    }
}