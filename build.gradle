plugins {
    id 'java-library'
    id 'maven-publish'
    id 'jacoco'
}

group = 'com.webkreator'
version = '4.0.0'

compileJava {
    options.compilerArgs += ["-parameters"]
}

// The default platform charset is not UTF-8 in every environment this builds in (LANG is unset in
// containers), and the test sources carry deliberate non-ASCII in both prose and assertions.
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

repositories {
    mavenCentral()
}

dependencyLocking {
    lockAllConfigurations()
}

sourceSets {
    main {
        java.srcDirs = ["src/main/java"]
        resources.srcDirs = ["src/main/resources"]
    }

    test {
        java.srcDirs = ["src/test/java"]
        resources.srcDirs = ["src/test/resources"]
    }

    // The browser tier. Kept out of `test` so that `./gradlew test` stays hermetic: no Playwright
    // on the classpath, no driver bundle to download, no browsers to install.
    browserTest {
        java.srcDirs = ["src/browserTest/java"]
        resources.srcDirs = ["src/browserTest/resources"]
        compileClasspath += sourceSets.test.output + sourceSets.main.output
        runtimeClasspath += sourceSets.test.output + sourceSets.main.output
    }
}

configurations {
    browserTestImplementation.extendsFrom testImplementation
    browserTestRuntimeOnly.extendsFrom testRuntimeOnly
}

// The dependencies are locked; to update the locks, run: ./gradlew dependencies --write-locks
dependencies {

    // https://mvnrepository.com/artifact/org.slf4j/slf4j-api
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '2.0.16'

    // https://mvnrepository.com/artifact/commons-cli/commons-cli
    implementation group: 'commons-cli', name: 'commons-cli', version: '1.9.0'

    // https://mvnrepository.com/artifact/commons-codec/commons-codec
    implementation group: 'commons-codec', name: 'commons-codec', version: '1.17.2'

    // https://mvnrepository.com/artifact/org.apache.commons/commons-email
    api group: 'org.apache.commons', name: 'commons-email', version: '1.6.0'

    // https://mvnrepository.com/artifact/jakarta.mail/jakarta.mail-api
    implementation group: 'jakarta.mail', name: 'jakarta.mail-api', version: '1.6.7'

    // https://mvnrepository.com/artifact/it.sauronsoftware.cron4j/cron4j
    implementation group: 'it.sauronsoftware.cron4j', name: 'cron4j', version: '2.2.5'

    // https://mvnrepository.com/artifact/org.apache.velocity/velocity-engine-core
    implementation group: 'org.apache.velocity', name: 'velocity-engine-core', version: '2.4.1'

    // https://mvnrepository.com/artifact/com.google.code.gson/gson
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.11.0'

    // https://mvnrepository.com/artifact/org.hibernate.validator/hibernate-validator
    implementation group: 'org.hibernate.validator', name: 'hibernate-validator', version: '6.2.5.Final'

    // https://mvnrepository.com/artifact/org.glassfish/jakarta.el
    testImplementation group: 'org.glassfish', name: 'jakarta.el', version: '3.0.4'

    // https://mvnrepository.com/artifact/jakarta.servlet/jakarta.servlet-api
    compileOnly group: 'jakarta.servlet', name: 'jakarta.servlet-api', version: '4.0.4'


    // Test dependencies.

    // https://mvnrepository.com/artifact/junit/junit
    testImplementation group: 'junit', name: 'junit', version: '4.13.2'

    // https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter', version: '6.1.2'

    // https://mvnrepository.com/artifact/org.junit.vintage/junit-vintage-engine
    // Keeps the pre-existing JUnit 4 tests (TestRouting) running on the JUnit Platform.
    testRuntimeOnly group: 'org.junit.vintage', name: 'junit-vintage-engine', version: '6.1.2'

    // https://mvnrepository.com/artifact/org.junit.platform/junit-platform-launcher
    testRuntimeOnly group: 'org.junit.platform', name: 'junit-platform-launcher', version: '6.1.2'

    // https://mvnrepository.com/artifact/org.jsoup/jsoup
    // Used by the Canoe test suite to decode attribute values the way a browser would.
    testImplementation group: 'org.jsoup', name: 'jsoup', version: '1.22.2'

    // https://mvnrepository.com/artifact/com.microsoft.playwright/playwright
    // Browser tier of the Canoe test suite. Scoped to the browserTest source set so that the
    // ~100 MB driver bundle never lands on the classpath of the hermetic `test` task.
    browserTestImplementation group: 'com.microsoft.playwright', name: 'playwright', version: '1.61.0'

    // https://mvnrepository.com/artifact/org.mockito/mockito-core
    testImplementation group: 'org.mockito', name: 'mockito-core', version: '5.11.0'

    // https://mvnrepository.com/artifact/org.slf4j/slf4j-simple
    testImplementation group: 'org.slf4j', name: 'slf4j-simple', version: '2.0.16'

    // https://mvnrepository.com/artifact/jakarta.servlet/jakarta.servlet-api
    testImplementation group: 'jakarta.servlet', name: 'jakarta.servlet-api', version: '4.0.4'
}

// `test` must stay hermetic, offline-capable and fast: no browsers, no network.
test {
    useJUnitPlatform()

    // T33's report is generated by a test, so it exists after every `test` run rather than only
    // when somebody remembers to ask for it. The path is passed in rather than hard-coded in the
    // test, because a test that writes to a relative path writes wherever the JVM happens to start.
    systemProperty 'canoe.report.dir', layout.buildDirectory.dir('reports/canoe').get().asFile.absolutePath

    // T31's fuzz seed. Fixed here so a CI failure reproduces; override on the command line to hunt:
    //   ./gradlew test --tests '*TemplateFuzzTest*' -Dcanoe.fuzz.seed=$RANDOM -Dcanoe.fuzz.iterations=200000
    systemProperty 'canoe.fuzz.seed', System.getProperty('canoe.fuzz.seed', '20260726')
    systemProperty 'canoe.fuzz.iterations', System.getProperty('canoe.fuzz.iterations', '2000')

    finalizedBy tasks.named('jacocoTestReport')
}

// ---------------------------------------------------------------------------
// T30 - the coverage gate
// ---------------------------------------------------------------------------

jacoco {
    // Latest on Maven Central as of 2026-07-26; earlier lines do not instrument JDK 25 class files.
    toolVersion = '0.8.15'
}

jacocoTestReport {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

/**
 * Branch-coverage floors for the two files the security review is about.
 *
 * An unreached branch in Canoe's tokenizer is, by definition, a security decision nobody tested:
 * every one of them classifies an attribute name, an attribute value prefix or a parser state, and
 * F1, F7 and F19 were all "a branch that is never taken" (F21 was its sibling: a dead switch arm,
 * though one reachable by a direct encode() call, closed by deletion in R14). So the gate is on
 * *branch* coverage and not on lines.
 *
 * MEASURED 2026-07-26, and the numbers below are the real ones rather than round figures.
 * RE-MEASURED after R2 (delete detectAttributePrefix()'s unconditional reset): every figure was
 * unchanged, floors included. The line R2 removed was an assignment and not a condition, so it
 * carried no branch; and no branch became unreachable, because the method's five comparison chains
 * were entered and left exactly as before.
 * RE-MEASURED after R3 (compare value prefixes by length rather than by fixed buffer indices). The
 * class total moved and no floor did. R3 replaced five hand-unrolled comparison chains - 88 branch
 * outcomes, all reached - with five calls to one bounded string comparison, so the class lost 72
 * branches it was covering and the ratio fell without a single outcome becoming unreached: the
 * missed count was 37 before and after, and it was the same 37.
 * RE-MEASURED after R4 (replace the on* table with a prefix rule), and this time both the totals and
 * the floors moved, because 25 of the 37 dead outcomes were the onselect/onsubmit block that R4
 * deleted. setTagAttributeContext() went from 392 branch outcomes to 18: eight hand-unrolled chains
 * plus a 24-branch handler table became nine calls to two bounded string comparisons. The missed
 * count is 12, and it no longer includes a single findings-related outcome except F7's.
 * RE-MEASURED after R5, R6 and R7, which land together and which R4's note warned would move this
 * method substantially. They did: setTagAttributeContext() is 8 outcomes rather than 18, because the
 * name comparisons became lookups in two declared sets, and it is fully covered - F7's dead `data`
 * comparison, the last findings-related exclusion, is gone with the branch pair R7 resolved. The
 * class total rose because the tasks added code that is *all* reachable: the fail-closed default, the
 * plain-text prefix families, the application allowlist and its validation. The missed count is 11,
 * and for the first time since this comment was written none of the eleven is a finding.
 * R27 still owns the final reconciliation; there is materially less left for it to do.
 * RE-MEASURED after R11 and R12 (delete the uriPattern passthrough; rewrite url() to parse the URL
 * and encode each component per byte). Canoe is untouched - the rewrite is entirely inside
 * HtmlEncoder - and HtmlEncoder went from 171/172 to 230/232 branches: url() grew from one allowlist
 * loop into a scheme check, a component splitter (appendHierPart) and a per-byte encoder
 * (appendEncoded), all reachable and exercised by HtmlEncoderUrlTest except the one short-circuit
 * outcome inventoried below. The HtmlEncoder floor rose 0.99->0.99 unchanged (99.14% against it, one
 * more missed branch would be 98.71%).
 *
 *   Canoe                             265 / 276 branches   96.01%   (was 247 / 259, 95.37%)
 *     setTagAttributeContext()          8 /   8           100.00%   (was 17 / 18, 94.44%)
 *     normalisePlainTextAttributeNames 20 /  20           100.00%   (new in R5)
 *     isPlainTextAttributeName()        6 /   6           100.00%   (new in R5)
 *     isNameChar()                     14 /  14           100.00%   (new in R5; isTagNameChar()
 *                                                                    delegates to it)
 *     reallyProcessChar()             173 / 178            97.19%
 *     detectAttributePrefix()          10 /  10           100.00%
 *     bufferedValueIs()                 6 /   6           100.00%
 *     bufferedNameStartsWith()          6 /   6           100.00%
 *     Canoe(Writer, Set)                2 /   2           100.00%   (new in R5)
 *     currentContext()                 10 /  12            83.33%   (was 9 / 11; the ATTR_UNKNOWN
 *                                                                    arm is reached)
 *     inBuf()                           0 /   4             0.00%
 *   HtmlEncoder                       230 / 232 branches   99.14%   (was 171 / 172, 99.42%; R11+R12
 *                                                                    rewrote url())
 *
 * bufferedNameIs() is gone: R5 replaced the exact-name comparisons with set lookups of the buffered
 * name, which reads exactly the characters the current name wrote and is bounded in the same sense.
 *
 * The floors move with the measurements, and each is set just below its measured value so that one
 * further missed outcome fails the gate. The Canoe class is at 96.01% against a floor of 0.96, and
 * losing one branch would be 95.65%; setTagAttributeContext() and
 * normalisePlainTextAttributeNames() are fully covered against floors of 0.99, and losing one branch
 * would be 87.50% and 95.00% respectively.
 *
 * normalisePlainTextAttributeNames() is gated individually, and it is the one addition to this list
 * that is a security decision rather than a measurement: it is the guard that stops an application
 * putting `sandbox`, `nonce` or `srcdoc` back on the plain-text allowlist through configuration. An
 * unreached branch in it is a refusal nobody tested.
 *
 * The plan (T30) asked for ~95% on the two named methods. Both reach it now. Counting only branches
 * an input can reach, both named methods and both classes are at 100% - except for two outcomes
 * JaCoCo cannot observe, which are also listed.
 *
 * EXCLUDED, with the test that proves each one dead:
 *
 *   The single setTagAttributeContext() exclusion that used to head this list is gone. It was the
 *   `data` -> ATTR_URI comparison, identical to the `content` comparison above it and therefore
 *   unreachable (F7); R7 resolved the pair - `data` is a URL and `content` suppresses - and the
 *   classification is a set lookup, which cannot hold the same name twice.
 *   -> AttributeNameMatrixTest.theSourceDeclaresTheTwoNameListsTheMatrixExpects asserts the
 *      ATTR_CONTENT constant and the author's XXX marker are both gone, and
 *      AttributePrefixTest.theDataBranchPairIsResolved keeps F7's reasoning where the branches were.
 *
 *   The 25 outcomes of the onselect/onsubmit block that used to be listed here are gone with the
 *   block. R4 deleted the whole on* table - 24 comparison chains of which 3 were silently dead, F1
 *   and F19 - and replaced it with one two-character prefix test whose true and false outcomes are
 *   both reached by every handler sweep in the suite.
 *   -> CanoeStateMachineTest.theSourceClassifiesHandlersByPrefixAndNotByName asserts that the
 *      method contains exactly one ATTR_JS assignment and no handler name at all, which is what
 *      keeps this entry from coming back.
 *
 *   reallyProcessChar(), 5 outcomes
 *      1  the default arm of switch(state) (Canoe.java:874). Nineteen states have a case; the two
 *         that do not are URL, which nothing ever assigns, and INVALID, which is only ever assigned
 *         immediately before raiseError() throws.
 *         -> AttributeNameMatrixTest.thereIsNoCtxCssAndStyleStillSuppresses (URL is dead),
 *            CanoeRobustnessTest (every raiseError message, each of which escapes)
 *      1  the default arm of switch(attrQuotes) (Canoe.java:1184). attrQuotes is assigned exactly
 *         one of QUOTE_NONE/QUOTE_SINGLE/QUOTE_DOUBLE and nowhere else.
 *      1  "Internal error #1001" (the bufLen == buf.length test at Canoe.java:1224). Value scanning
 *         gives up at bufLen == 10, so bufLen can never equal buf.length.
 *         -> CanoeRobustnessTest.everyRaiseErrorMessageIsReached lists the twelve that are.
 *      2  UNMEASURABLE rather than unreached: Canoe.java:911 (COMMENT_OPEN_OR_DOCTYPE's else) and
 *         Canoe.java:931 (COMMENT_OPEN_2's else), whose failing outcome enters a block that calls
 *         raiseError() and then falls through to `break` with no `return`. raiseError() always
 *         throws, so no JaCoCo probe downstream of those blocks is ever executed and the outcome
 *         is reported missed. Both are exercised:
 *         -> CanoeRobustnessTest rows "bang that is neither comment nor doctype" (<!x>) and
 *            "single dash after a bang" (<!-x-->), which assert the raised message and position.
 *         Every raiseError() call site in the file reports zero instruction coverage for the same
 *         reason, including the thirteen the suite provably reaches.
 *
 *   R8 moved the two class/method floors down (Canoe class 0.96 -> 0.95, reallyProcessChar
 *   0.97 -> 0.96) without adding a single unreached branch. It replaced TAG_NAME's script/style
 *   detection - two `&&` chains of fixed buf[] index reads, thirteen branch outcomes, all of them
 *   always covered - with `tagName.equals("script")`/`.equals("style")`, two outcomes, still always
 *   covered. Retiring those thirteen live branches shrank the denominator, so the eleven genuinely
 *   dead outcomes inventoried here (5 reallyProcessChar + 2 currentContext + 4 inBuf) are now a
 *   larger share of a smaller total: 245/256 = 95.70% for the class, 153/158 = 96.84% for the
 *   method. Same eleven, no twelfth.
 *   -> TagNameTrackingTest.theScriptAndStyleEndTagsAreNamedDespiteSkippingTagName and
 *      theNameIsClearedTheMomentTheTagEnds reach both new equals outcomes and the closingTag
 *      ternary; nothing R8 added is unreached.
 *
 *   currentContext(), 2 outcomes  (not gated individually; part of the class figure)
 *      1  `case URL` - the URL state is declared and never assigned.
 *      1  the inner `default:` - all seven ATTR_* constants have a case above it, ATTR_UNKNOWN
 *         included since R5, so it is unreachable. (This was tagged F21; R14 closed F21 by deleting
 *         CTX_CSS, and the inner default stays dead for the unrelated reason that every ATTR_* is
 *         matched.)
 *
 *   inBuf(), 4 outcomes  (not gated individually; part of the class figure)
 *      4  the method is called only from commented-out debug statements (Canoe.java:995, 1107).
 *
 *   HtmlEncoder, 5 outcomes
 *      1  the null guard of the private css(String, StringBuilder). The public css(String) returns
 *         null before calling it and nothing else calls it.
 *         -> HtmlEncoderTest.theAppendingOverloadsAppendNothingForNull says so in its javadoc.
 *      1  the second half of appendHierPart()'s fragment guard, `i < s.length() && s.charAt(i) == '#'`
 *         (HtmlEncoder.java:321). Introduced by R12's url() rewrite. The query block above sets `i`
 *         to either the '#' that begins the fragment or the end of the string, so whenever
 *         `i < s.length()` holds the character there is always '#'; JaCoCo counts the '#' comparison's
 *         false outcome, which the control flow cannot reach.
 *         -> HtmlEncoderUrlTest.aFullHierarchyIsSplitIntoItsComponents and .theAuthorityStopsAtThe
 *            FirstQueryOrFragment reach every fragment/no-fragment path there is.
 *      3  the two incomplete-escape guards of percentDecode() (`c == '%' && i + 2 < length` and the
 *         two isHex() tests). Introduced by R9. percentDecode() runs only on url()'s own output, and
 *         url() never emits a bare or truncated `%` - every `%` it writes begins a complete `%XX`
 *         from a hex pair, and a `%` that did not was itself escaped to `%25`. So the "not a `%`" and
 *         "a complete `%XX`" outcomes are both reached, and the "`%` with no two hex digits after it"
 *         outcomes cannot be, because that input shape does not exist in url()'s output.
 *         -> HtmlEncoderResourceUrlTest.valuesUrlAlreadyNeutralisedAreNotSuppressedAgain and
 *            .aHostThatFailsToParseIsNotAnOffOriginAuthority reach the live percent-decode paths
 *            (%40, %5C, %01, %7F) through url()-encoded input, which is the only way percentDecode()
 *            is called.
 *
 *   R11 deleted the non-final `uriPattern` field (the last non-final static in either class), and R12
 *   replaced the private url(String, StringBuilder) worker with appendHierPart()/appendEncoded(),
 *   both fully covered by HtmlEncoderUrlTest bar the one short-circuit outcome above.
 *
 * RE-MEASURED after R9 (reject off-origin/protocol-relative URLs in resource-loading sinks). Canoe
 * gained a small, fully covered routing narrowing - isResourceLoadingSink(), the ATTR_URI_RESOURCE
 * arm of setTagAttributeContext(), and the CTX_URI_RESOURCE arms of currentContext() and encode() -
 * and its class figure is 251/262 = 95.80% against the 0.95 floor, the same eleven dead outcomes as
 * after R8, no twelfth. HtmlEncoder gained urlResource() and its TrustedOrigin allowlist, an origin
 * filter over url()'s own output: 85 new branches, all reachable and exercised by
 * HtmlEncoderResourceUrlTest except the three percentDecode() guards inventoried above, which url()'s
 * output shape cannot reach. It is 315/320 = 98.44%, so the HtmlEncoder floor moves 0.99 -> 0.98;
 * losing one more branch would be 98.13%. The three new dead outcomes are the only additions to the
 * inventory, and none of them is a finding.
 *
 *   Canoe                             251 / 262 branches   95.80%   (was 265 / 276; R8 then R9)
 *   HtmlEncoder                       315 / 320 branches   98.44%   (was 230 / 232; R9 added
 *                                                                    urlResource() + TrustedOrigin)
 *
 * RE-MEASURED after R13 (fix js() and css(), F16). js() gained one branch - the astral case, a fourth
 * arm below the `c <= 0xFFFF` test that emits a UTF-16 surrogate pair - and css() lost one, the old
 * `c <= 255` test whose false arm emitted a literal '?'; the new css() escapes every non-alphanumeric
 * as a six-digit hex escape and has no such split. Net zero, so HtmlEncoder is unchanged at 315/320 =
 * 98.44% and the 0.98 floor does not move. The five dead outcomes are the same five inventoried above -
 * js()'s and css()'s new/changed arms are all reached by HtmlEncoderTest (BMP, astral and non-Latin-1
 * are all swept), the private css(String, StringBuilder) null guard is still the only css dead outcome,
 * and no finding is in the inventory.
 * RE-MEASURED after R14 (settle CTX_CSS, F21). encode() lost the CTX_CSS switch arm - it was a live
 * branch, covered by tests calling Canoe.encode(value, CTX_CSS) directly, not a dead one - so the
 * Canoe class figure drops by exactly one covered branch and one total: 250/261 = 95.79% (was
 * 251/262), still above the 0.95 floor, so no floor moves. HtmlEncoder is untouched. The eleven dead
 * outcomes are unchanged (5 reallyProcessChar + 2 currentContext + 4 inBuf); F21 was never in the
 * inventory (its CTX_CSS arm was covered by a direct call, and its unreachable half - currentContext's
 * inner default - stays dead for the ATTR_* reason above), so removing the constant left the inventory
 * as it was.
 * RE-MEASURED after R15 (fix write(char[], int, int), F9). The fix is arithmetic only: the loop bound
 * became `i < offset + len` (one condition, as `i < len` was) and the error-path length became
 * `i - offset`, with no branch added or removed. The catch arm was covered before and after by
 * CanoeWriterContractTest, so the Canoe class figure is unchanged at 250/261 = 95.79%, the eleven dead
 * outcomes are unchanged, and no floor moves. HtmlEncoder is untouched.
 * RE-MEASURED after R16 (fix COMMENT_CLOSE_2, F14). The COMMENT_CLOSE_2 arm of reallyProcessChar()
 * gained one condition: it was `if (c == '>') ... else ...` (two outcomes) and is now
 * `if (c == '>') ... else if (c == '-') ... else ...` (four outcomes), the new middle arm being the
 * HTML Standard's rule that a further '-' stays in comment-end. All four outcomes are reached -
 * CanoeStateMachineTest.aCommentEndingInThreeDashesNowCloses and its transitions rows drive '>'
 * (close), '-' (stay) and a plain char (drop back to COMMENT) - so the Canoe class gains two covered
 * branches and two total: 252/263 = 95.82% (was 250/261), reallyProcessChar 155/160 = 96.88% (was
 * 153/158). Both stay above their 0.95 and 0.96 floors, so no floor moves, and the eleven dead
 * outcomes are unchanged (5 reallyProcessChar + 2 currentContext + 4 inBuf); F14 was never in the
 * inventory - its bug was a wrong transition target, not an unreachable branch.
 *
 *   Canoe                             252 / 263 branches   95.82%   (was 250 / 261; R16 added the
 *                                                                    comment-end '-' arm)
 *   HtmlEncoder                       315 / 320 branches   98.44%   (unchanged by R14, R15, R16)
 *
 * RE-MEASURED after R17 (fix SCRIPT_END and CSS_END, F10). The largest addition since R9, and every
 * branch of it is reached. Four things grew:
 *   - two new states, SCRIPT_END_NAME and CSS_END_NAME, each an `if (isEndTagNameDelimiter(c))` with
 *     both outcomes driven (2 x 2 = 4 outcomes), plus the two new `case` labels in
 *     reallyProcessChar()'s switch(state) (2). reallyProcessChar 155/160 -> 161/166 = 96.99%.
 *   - the new private isEndTagNameDelimiter(), a seven-way `||` chain = 14 outcomes, all covered:
 *     CanoeStateMachineTest.scriptEndRequiresADelimiterAfterTheName and
 *     ScriptAndStyleElementTest.onlyTheStandardsDelimitersEndTheElement drive each of space, tab, LF,
 *     CR, FF, '/' and '>' (the true outcome of each condition) and a suffixed name (the false outcome
 *     of all seven). It is not gated individually - like isNameChar() and isPlainTextAttributeName()
 *     it is a pure predicate with no configuration behind it, and it is part of the class figure.
 *   - the new private asciiToLowerCase(), which bounds the fold SCRIPT_END and CSS_END apply to the
 *     end tag name to ASCII. Two conditions = 4 outcomes, all reached by ordinary end tags: '/'
 *     (below 'A'), 'S' in `</SCRIPT>` (both true) and 's' (above 'Z').
 *     CanoeStateMachineTest.theEndTagNameIsMatchedWithAnAsciiFoldAndNotAUnicodeOne is the test that
 *     says why the bound is there - Character.toLowerCase(U+0130) is 'i', so the wider fold left
 *     F10's forward desync open for `</scr\u0130pt>`. Ungated for the same reason as its neighbour.
 *   - currentContext() gains the SCRIPT_END_NAME (CTX_JS) and CSS_END_NAME (CTX_SUPPRESS) arms:
 *     10/12 -> 11/13, the two missed outcomes still being `case URL` and the inner default.
 * Canoe is 276/287 = 96.17% (was 252/263), the eleven dead outcomes are unchanged (5 reallyProcessChar
 * + 2 currentContext + 4 inBuf) and F10 was never in the inventory - its bug was a missing test, a
 * dropped character and an over-wide fold, not an unreachable branch. HtmlEncoder is untouched. No
 * floor moves: both figures are comfortably above 0.95 and 0.96, and raising them to sit one outcome
 * below the measurement is R27's reconciliation rather than this task's - R8 and R16 left the same
 * slack for the same reason.
 *
 *   Canoe                             276 / 287 branches   96.17%   (was 252 / 263; R17 added the
 *                                                                    two end-tag-name states,
 *                                                                    isEndTagNameDelimiter() and
 *                                                                    asciiToLowerCase())
 *   HtmlEncoder                       315 / 320 branches   98.44%   (unchanged by R14 - R17)
 *
 * RE-MEASURED after R18 (fix the DOCTYPE precondition, F18). One condition became two, and both are
 * driven from both sides. COMMENT_OPEN_OR_DOCTYPE tested `tagCount != 1` (2 outcomes); it now tests
 * `elementSeen` and then `doctypeSeen` (4 outcomes), which is what splits "a DOCTYPE after an
 * element" from "a second DOCTYPE" and lets each have its own message. All four are reached, by
 * CanoeRobustnessTest: the rejection table's rows "DOCTYPE after another element", "DOCTYPE after an
 * end tag", "second DOCTYPE" and "second DOCTYPE after a comment" drive the two true outcomes, and
 * every accepted DOCTYPE in the suite drives the two false ones. The TAG_NAME change is a reorder -
 * the '!' test moved above the '/' test so that `elementSeen = true` sits between them - and neither
 * condition's outcome count moved. So Canoe gains two covered branches and two total: 278/289 =
 * 96.19% (was 276/287), reallyProcessChar 163/168 = 97.02% (was 161/166). Both stay above their 0.95
 * and 0.96 floors, so no floor moves; R27 is where the accumulated slack gets reconciled.
 *
 * The eleven dead outcomes are unchanged and are still the same eleven (5 reallyProcessChar +
 * 2 currentContext + 4 inBuf), verified line by line against the XML rather than inferred from the
 * totals: switch(state)'s default, COMMENT_OPEN_OR_DOCTYPE's else, COMMENT_OPEN_2's else,
 * switch(attrQuotes)'s default and "Internal error #1001" in reallyProcessChar; `case URL` and the
 * inner default in currentContext(); the four in inBuf(). F18 was never in the inventory - its bug
 * was a precondition that asked the wrong question, not an unreachable branch - and R18 adds nothing
 * to it. Note that the two raiseError() arms R18 adds are measured *covered*, unlike the two
 * UNMEASURABLE else-arms listed above: those are the failing outcome of a condition whose block
 * falls through to `break` with no probe in between, whereas these two are if/else-if arms whose
 * decision probe is emitted before the throwing call. HtmlEncoder is untouched.
 *
 *   Canoe                             278 / 289 branches   96.19%   (was 276 / 287; R18 split the
 *                                                                    DOCTYPE precondition in two)
 *   HtmlEncoder                       315 / 320 branches   98.44%   (unchanged by R14 - R18)
 */
ext.canoeCoverageFloors = [
        [kind: 'class',  target: 'com/webkreator/qlue/view/Canoe',       floor: 0.95],
        [kind: 'class',  target: 'com/webkreator/qlue/util/HtmlEncoder', floor: 0.98],
        [kind: 'method', target: 'com/webkreator/qlue/view/Canoe#setTagAttributeContext', floor: 0.99],
        [kind: 'method', target: 'com/webkreator/qlue/view/Canoe#reallyProcessChar',      floor: 0.96],
        [kind: 'method', target: 'com/webkreator/qlue/view/Canoe#normalisePlainTextAttributeNames',
         floor: 0.99],
]

tasks.register('canoeCoverageGate') {
    group = 'verification'
    description = 'Fails if branch coverage of Canoe or HtmlEncoder drops below the T30 floors.'

    dependsOn tasks.named('jacocoTestReport')

    def reportFile = layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml')
    def floors = canoeCoverageFloors
    inputs.file(reportFile)
    outputs.upToDateWhen { false }

    doLast {
        def file = reportFile.get().asFile
        if (!file.exists()) {
            throw new GradleException("No JaCoCo XML report at ${file}. Run ./gradlew test first.")
        }

        // The report carries a DOCTYPE pointing at a report.dtd that is not on disk.
        def parser = new groovy.xml.XmlParser(false, false)
        parser.setFeature('http://apache.org/xml/features/nonvalidating/load-external-dtd', false)
        parser.setFeature('http://apache.org/xml/features/disallow-doctype-decl', false)
        def report = parser.parse(file)

        def branchRatioOf = { node ->
            def counter = node.counter.find { it.@type == 'BRANCH' }
            if (counter == null) {
                return null
            }
            int missed = counter.@missed as int
            int covered = counter.@covered as int
            [covered: covered, total: missed + covered,
             ratio  : (missed + covered) == 0 ? 1.0d : covered / (double) (missed + covered)]
        }

        def failures = []
        def measurements = []

        floors.each { floor ->
            def name = floor.target
            def measured = null

            if (floor.kind == 'class') {
                def cls = report.'**'.class.find { it.@name == name }
                if (cls != null) {
                    measured = branchRatioOf(cls)
                }
            } else {
                def (className, methodName) = name.split('#')
                def cls = report.'**'.class.find { it.@name == className }
                if (cls != null) {
                    // A method name is not unique - HtmlEncoder has five overloads called html -
                    // so every match is summed, which is what "coverage of this method" means when
                    // the method is overloaded. Neither gated method is.
                    def methods = cls.method.findAll { it.@name == methodName }
                    if (!methods.isEmpty()) {
                        int covered = 0
                        int total = 0
                        methods.each {
                            def r = branchRatioOf(it)
                            if (r != null) {
                                covered += r.covered
                                total += r.total
                            }
                        }
                        measured = [covered: covered, total: total,
                                    ratio  : total == 0 ? 1.0d : covered / (double) total]
                    }
                }
            }

            // A gate that silently matches nothing is the failure mode PLAN.md section 8 warns
            // about, so an absent target is a failure rather than a pass.
            if (measured == null) {
                failures << "${name}: not present in the JaCoCo report. Renamed, or no longer" +
                        " instrumented - either way this gate was about to pass without measuring" +
                        " anything."
                return
            }

            measurements << String.format('  %-58s %4d/%-4d = %6.2f%%  (floor %.0f%%)',
                    name, measured.covered, measured.total, measured.ratio * 100, floor.floor * 100)

            if (measured.ratio < floor.floor) {
                failures << String.format(
                        '%s: branch coverage %.2f%% (%d/%d) is below the floor of %.2f%%.',
                        name, measured.ratio * 100, measured.covered, measured.total,
                        floor.floor * 100)
            }
        }

        logger.lifecycle('Canoe branch-coverage gate (T30):')
        measurements.each { logger.lifecycle(it) }

        if (!failures.isEmpty()) {
            throw new GradleException('Canoe coverage gate failed:\n  ' + failures.join('\n  ')
                    + '\n\nAn unreached branch in Canoe.java is an untested security decision. If a'
                    + ' branch has become unreachable because a finding was fixed, lower the floor'
                    + ' and add it to the exclusion list in build.gradle with the test that proves'
                    + ' it dead. Do not lower the floor without doing that.')
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('canoeCoverageGate')
}

// The browser tier of the Canoe suite. Not wired into `check`, so `./gradlew build`
// never needs a browser install. Run explicitly: ./gradlew browserTest
tasks.register('browserTest', Test) {
    group = 'verification'
    description = 'Runs the Playwright-driven Canoe browser tests.'

    testClassesDirs = sourceSets.browserTest.output.classesDirs
    classpath = sourceSets.browserTest.runtimeClasspath

    useJUnitPlatform()

    // Honour a shared browser cache if the environment provides one.
    if (System.getenv('PLAYWRIGHT_BROWSERS_PATH') != null) {
        environment 'PLAYWRIGHT_BROWSERS_PATH', System.getenv('PLAYWRIGHT_BROWSERS_PATH')
    }

    // Running tests must never trigger a browser download: that is playwrightInstall's job, and a
    // silent 8-minute download inside a test run is indistinguishable from a hang. Without this,
    // a read-only shared browser cache turns every run into a failed download attempt.
    environment 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', '1'

    shouldRunAfter tasks.named('test')

    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
}

// Downloads the browser binaries Playwright needs. Run once before `browserTest`.
tasks.register('playwrightInstall', JavaExec) {
    group = 'verification'
    description = 'Downloads the Playwright browser binaries (chromium, firefox, webkit).'

    classpath = sourceSets.browserTest.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', 'chromium', 'firefox', 'webkit'

    if (System.getenv('PLAYWRIGHT_BROWSERS_PATH') != null) {
        environment 'PLAYWRIGHT_BROWSERS_PATH', System.getenv('PLAYWRIGHT_BROWSERS_PATH')
    }
}

task sourcesJar(type: Jar, dependsOn: classes) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

artifacts {
    archives sourcesJar
    //archives javadocJar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = "https://maven.pkg.github.com/ivanr/qlue"
            credentials {
                // Working with the Gradle registry
                // https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-gradle-registry
                username = System.getenv("GITHUB_PACKAGES_USERNAME")
                password = System.getenv("GITHUB_PACKAGES_PASSWORD")
            }
        }
    }
}